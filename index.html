function applySkillDebuff(src,tgt,ult){if(src.side!=='a'||tgt.hp<=0||!Number.isInteger(src.id)||src.id>=30)return;
 let chance=debuffChance(src.id,ult);if(!chance||Math.random()>=chance)return;
 let elem=UNITS[src.id].elem,kind=DEBUFFS[elem][1];
 if(kind==='stun'){tgt.stun=1;}else tgt[kind]=Math.max(tgt[kind]||0,1+(ult?1:0)+(skillLv(src.id)>=4?1:0));
 pushLog(`${DEBUFFS[elem][0]}! ${UNITS[tgt.id].name}에게 ${kind==='stun'?'다음 행동 방해':kind==='burn'?'지속 피해':kind==='curse'?'방어력 감소':'공격력 감소'} 적용`);
}
function statusText(f){return [f.burn?'🔥'+f.burn:'',f.chill?'❄'+f.chill:'',f.root?'🌿'+f.root:'',f.stun?'⚡마비':'',f.dazzle?'☀'+f.dazzle:'',f.curse?'🌑'+f.curse:''].filter(Boolean).join(' ')}
function debuffDescription(f,ult){if(f.side!=='a'||f.id>=30||!skillLv(f.id))return '';
 let job=UNITS[f.id].job;if(job===1||job===3||job===5||job===4)return '';
 let elem=UNITS[f.id].elem, chance=Math.round(debuffChance(f.id,ult)*100);
 let effect=['라운드마다 최대 HP 4.5% 피해','공격력 18% 감소','공격력 15% 감소','다음 행동 1회 방해','공격력 12% 감소','방어력 28% 감소'][elem];
 return ` · 강화 효과: ${DEBUFFS[elem][0]} ${chance}% (${effect})`;
}
function restoreAll(team,amount){team.filter(f=>f.hp>0).forEach(f=>healUnit(f,amount))}
function useMove(src,move,tgt){let u=UNITS[src.id],boost=src.side==='a'?1+skillLv(src.id)*.12:1,allies=src.side==='a'?battle.ally:battle.enemy,enemies=src.side==='a'?battle.enemy:battle.ally;if(move===3){src.guard=1;src.shield+=Math.round(src.max*.12);pushLog(`${u.name} 방어!`);return}if(move===0){if(src.charge){let power=src.charge;src.charge=0;damage(src,tgt,power,0.28);pushLog('💥 암살자의 기습 폭발!')}else damage(src,tgt,1);return}let ult=move===2,job=u.job;src.cd[move-1]=ult?4:2;pushLog(`✨ ${u.name}: ${ult?u.ult:u.skill}!`);
if(job===3){if(ult){restoreAll(allies,src.atk*2.3*boost);pushLog('아군 전체 회복!')}else{let heal=healUnit(tgt,src.atk*2.1*boost);pushLog(`${UNITS[tgt.id].name} HP +${heal}`)}return}
if(job===5){let active=allies.filter(f=>f.hp>0&&f.summoned).length;if(allies.length>=5||active>=2){pushLog('소환 공간이 가득 차 기본 마법 공격으로 전환!');damage(src,tgt,(ult?1.9:1.2)*boost);return}let summonId=src.id<30?src.id:30+((src.id-30+1)%12);let member=makeFighter(summonId,Math.max(1,Math.floor(src.max/45)),src.side,allies.length);member.summoned=true;member.hp=member.max=Math.max(20,Math.round(src.max*(ult?.65:.42)));member.atk=Math.max(5,Math.round(src.atk*(ult?.8:.6)*boost));member.def=Math.round(src.def*.7);member.acted=true;allies.push(member);pushLog(`🃏 ${u.name}이 ${UNITS[member.id].name} 소환 카드 등장! (${allies.length}/5)`);return}
if(job===4){src.charge=ult?3.8:2.5;pushLog(`🌑 ${u.name}이 그림자 속에서 힘을 모은다! 다음 행동에 ${src.charge}배 공격`);return}
if(job===1){let amount=Math.round(src.atk*(ult?2.3:1.7)*boost);if(ult)allies.filter(f=>f.hp>0).forEach(f=>f.shield+=amount);else tgt.shield+=amount;pushLog(`🛡 보호막 +${amount}`);return}
if(ult){enemies.filter(f=>f.hp>0).forEach(f=>{damage(src,f,(job===4?2:1.5)*boost,job===4?.22:0);applySkillDebuff(src,f,true)});if(job===5)restoreAll(allies,src.atk*.5*boost)}else{damage(src,tgt,(job===4?1.6:job===5?1.4:1.45)*boost,job===4?.22:0);applySkillDebuff(src,tgt,false);if(job===5&&tgt.hp>0)damage(src,tgt,.35*boost)}
if(job===2&&Math.random()<(ult?.4:.2)){let f=choose(alive(src.side==='a'?'e':'a'));if(f){f.stun=1;pushLog(`❄ ${UNITS[f.id].name} 행동 방해!`)}}
}
function availableFighters(side){return alive(side).filter(x=>!x.acted)}
function advanceRound(){if(!battle||battle.done)return;let a=alive('a'),e=alive('e');if(!a.length)return finish(false);if(!e.length)return finish(true);if(!availableFighters('a').length&&!availableFighters('e').length){battle.round++;[...a,...e].forEach(f=>{f.acted=false;f.guard=0;['chill','root','dazzle','curse'].forEach(k=>{if(f[k]>0)f[k]--});if(f.burn){f.burn--;let d=Math.max(1,Math.round(f.max*.045));f.hp=Math.max(0,f.hp-d);pushLog(`🔥 ${UNITS[f.id].name} 화상 ${d} 피해`)} });pushLog(`━━ ${battle.round}라운드 ━━`);if(!alive('a').length)return finish(false);if(!alive('e').length)return finish(true)}let side=battle.next;if(!availableFighters(side).length)side=side==='a'?'e':'a';battle.next=side;selectedAlly=availableFighters('a')[0]?.slot??0;selectedAction=0;battle.phase=side==='a'?'choose':'enemy';render();if(side==='e')setTimeout(enemyTurn,auto?200:540);else if(auto)setTimeout(autoTurn,300)}
function execute(src,move,tgt){if(!battle||battle.done||src.acted||src.hp<=0)return;src.acted=true;src.cd=src.cd.map((x,i)=>i===move-1?x:Math.max(0,x-1));if(src.stun){src.stun=0;pushLog(`${UNITS[src.id].name} 행동 불가!`)}else useMove(src,src.charge?0:move,tgt);battle.next=src.side==='a'?'e':'a';save();advanceRound()}
function selectAlly(slot){if(auto)return;let f=battle.ally[slot];if(!f||f.hp<=0||f.acted)return;selectedAlly=slot;selectedAction=0;render()}
function moveSelect(m){if(!battle||battle.next!=='a'||auto)return;let f=battle.ally[selectedAlly];if(!f||f.acted||(f.charge&&m!==0)||m===1&&f.cd[0]||m===2&&f.cd[1])return;selectedAction=m;let possible=possibleTargets(f,m);if(possible.length===1)actTarget(possible[0].slot);else render()}
function possibleTargets(f,m){if(!f||!UNITS[f.id]||!battle)return [];let supporting=(m===1||m===2)&&(UNITS[f.id].job===1||UNITS[f.id].job===3);return alive(supporting?'a':f.side==='a'?'e':'a')}
function actTarget(slot){if(!battle||battle.done||battle.next!=='a'||auto)return;let f=battle.ally[selectedAlly];if(!f)return;let targets=possibleTargets(f,selectedAction),t=targets.find(x=>x.slot===slot);if(!f||f.acted||!t)return;execute(f,selectedAction,t)}
function enemyTurn(){if(!battle||battle.done||battle.next!=='e')return;let src=choose(availableFighters('e'));if(!src){advanceRound();return}let j=UNITS[src.id].job,move=src.cd[1]===0&&Math.random()<.23?2:src.cd[0]===0&&Math.random()<.48?1:0,targets=possibleTargets(src,move),t=j===3?targets.reduce((a,b)=>a.hp/a.max<b.hp/b.max?a:b):choose(targets);execute(src,move,t)}
function autoTurn(){if(!auto||!battle||battle.done||battle.next!=='a')return;let f=availableFighters('a').sort((a,b)=>b.spd-a.spd)[0];if(!f){advanceRound();return}let j=UNITS[f.id].job,move=f.charge?0:f.cd[1]===0?2:f.cd[0]===0?1:0,targets=possibleTargets(f,move),t=j===3?targets.reduce((a,b)=>a.hp/a.max<b.hp/b.max?a:b):targets.slice().sort((a,b)=>a.hp-b.hp)[0];execute(f,move,t)}
function toggleAuto(){auto=!auto;render();if(auto&&battle&&!battle.done&&battle.next==='a')setTimeout(autoTurn,260)}
function finish(win,forfeit=false){if(!battle||battle.done)return;battle.done=true;auto=false;let b=battle,rewards={g:0,gold:0};if(win){let first=b.mode==='story'&&b.n>s.highest;if(first)s.highest=b.n;let boss=b.boss,bonus=b.mode==='story'&&first?(boss?120:45):0;rewards.g=b.mode==='tower'?12+Math.floor(b.n/5)*3:8+Math.floor(b.n/10)+bonus;rewards.gold=150+b.n*35+(boss?250:0);s.gems+=rewards.g;s.gold+=rewards.gold;if(b.mode==='tower'){s.towerBest=Math.max(s.towerBest,b.n)}}else{pushLog(forfeit?'전투 포기':'아군이 전멸했습니다!');if(b.mode==='tower')pushLog('무한의 탑 진행도가 1층으로 초기화됩니다.')}b.rewards=rewards;pushLog(win?'🏆 전투 승리!':'패배');save();render()}
function afterBattle(){if(!battle)return;let b=battle;if(b.mode==='tower'&&b.done&&b.rewards.g>=1){let n=b.n+1;battle=null;startBattle('tower',n)}else{battle=null;render()}}
function calcHitRange(src,tgt,power,critBonus=0){
 let mult=elementMult(UNITS[src.id].elem,UNITS[tgt.id].elem),def=tgt.def*(tgt.guard?1.45:1),factor=100/(100+def*.9);
 let lo=Math.max(1,Math.round(src.atk*power*.8*mult*factor)),hi=Math.max(1,Math.round(src.atk*power*1.15*mult*factor));
 let crit=Math.min(.9,src.crit+critBonus);return {lo,hi,crit,mult};
}
function abilityInfo(f,move){
 let u=UNITS[f.id]||UNITS[0],job=u.job,boost=f.side==='a'?1+skillLv(f.id)*.12:1,ult=move===2;
 if(move===3)return {title:'방어',text:`받는 피해 감소 · 보호막 +${Math.round(f.max*.12)}`,support:true};
 if(move===0)return {title:f.charge?'충전된 기습':'기본 공격',text:f.charge?`준비 완료! 공격력 ${Math.round(f.charge*100)}% 피해 · 치명타 확률 +28%`:'적 1명 공격 · 공격력 100%',power:f.charge||1,critBonus:f.charge?.28:0};
 if(job===3)return {title:ult?u.ult:u.skill,text:ult?`아군 전체 HP 최대 +${Math.round(f.atk*2.3*boost)} 회복`:`아군 1명 HP 최대 +${Math.round(f.atk*2.1*boost)} 회복`,support:true};
 if(job===1)return {title:ult?u.ult:u.skill,text:`${ult?'아군 전체':'아군 1명'} 추가 체력 보호막 +${Math.round(f.atk*(ult?2.3:1.7)*boost)}`,support:true};
 if(job===4)return {title:ult?u.ult:u.skill,text:`이번 행동은 공격하지 않음 · 다음 행동에 공격력 ${ult?380:250}% 기습 준비`,support:true};
 if(job===5)return {title:ult?u.ult:u.skill,text:`${ult?'강화된':'일반'} 소환 카드 1장 추가 · 소환 최대 2장, 아군 카드 총 5장까지`,support:true};
 return {title:ult?u.ult:u.skill,text:job===2?(ult?'적 전체 마법 공격 · 행동 방해 40%':'적 1명 마법 공격 · 행동 방해 20%')+debuffDescription(f,ult):(ult?'적 전체 공격':'적 1명 공격')+debuffDescription(f,ult),power:(ult?1.5:1.45)*boost,aoe:ult};
}
function damageHint(src,tgt,move){let info=abilityInfo(src,move);if(!info.power)return '';let h=calcHitRange(src,tgt,info.power,info.critBonus||0);return `${h.lo}~${h.hi}${h.mult===1.5?' ↑상성':h.mult===.75?' ↓상성':''}`;}
function abilityButton(f,m){let u=UNITS[f.id]||UNITS[0],info=abilityInfo(f,m),t=battle.enemy.find(x=>x.hp>0),hint=info.power&&t?damageHint(f,t,m):'',cd=m===1?f.cd[0]:m===2?f.cd[1]:0;
 let title=m===0?'⚔ 기본 공격':m===1?`${EICON[u.elem]} ${u.skill}`:m===2?`✨ ${u.ult}`:'🛡 방어';
 let desc=info.text||'스킬 효과 정보 없음';
 let disabled=battle.next!=='a'||auto||f.acted||(m===1&&f.cd[0])||(m===2&&f.cd[1])||(f.charge&&m!==0);
 return `<button class="skill-action ${selectedAction===m?'on':''}" onclick="moveSelect(${m})" ${disabled?'disabled':''}><b>${title}</b><span class="skill-desc">${desc}${cd?` · 쿨타임 ${cd}턴`:''}</span>${hint?`<span class="skill-power">예상 피해 ${hint} ${info.aoe?'(대상별)':''}</span>`:''}</button>`;
}
function combatUnit(f){let u=UNITS[f.id],side=f.side,sel=side==='a'&&selectedAlly===f.slot&&battle.next==='a',isTarget=battle.next==='a'&&possibleTargets(battle.ally[selectedAlly]||battle.ally[0],selectedAction).some(x=>x.side===side&&x.slot===f.slot);return `<div role="button" tabindex="0" aria-label="${u.name} 체력 ${f.hp}/${f.max}" class="fighter ${f.hp<=0?'dead':''} ${sel?'turn':''} ${isTarget?'target focustarget':''}" onclick="${side==='a'&&!isTarget?`selectAlly(${f.slot})`:isTarget?`actTarget(${f.slot})`:''}"><div class="label">${u.name}${f.boss?' 👑':''}${f.summoned?' ✦소환':''}</div>${portrait(f.id)}<div class="hp"><i style="width:${100*f.hp/f.max}%"></i></div><div class="muted" style="font-size:10px">${f.hp}/${f.max} ${f.shield?'🛡'+f.shield:''} ${f.charge?'🌑충전':''} ${statusText(f)} ${f.acted?'✓':''}</div>${isTarget&&side==='e'&&!auto&&battle.next==='a'&&abilityInfo(battle.ally[selectedAlly]||battle.ally[0],selectedAction).power?`<div class="target-damage">예상 ${damageHint(battle.ally[selectedAlly]||battle.ally[0],f,selectedAction)}</div>`:''}</div>`}
function battleScreen(){let b=battle;if(!b)return '';let f=b.ally[selectedAlly]||b.ally[0],u=UNITS[f.id],target=possibleTargets(f,selectedAction),selText=b.next==='a'&&!auto?'대상 카드를 누르세요':'상대 행동 중';return `<div class="row between"><h2>⚔ ${b.mode==='story'?'스토리':'무한의 탑'} ${b.n}${b.boss?' 👑보스':''}</h2><span class="pill">라운드 ${b.round}</span></div><div class="row between" style="margin-bottom:8px"><span class="pill">${b.done?(b.rewards.g?'🏆 승리':'패배'):b.next==='a'?'🟢 아군 차례':'🔴 적군 차례'}</span><button class="small" onclick="toggleAuto()" ${b.done?'disabled':''}>${auto?'⏸ 자동 전투 ON':'▶ 자동 전투 OFF'}</button></div><div class="battlefield" id="battlefield"><div class="battlegrid">${b.enemy.map(combatUnit).join('')}</div><div style="text-align:center;color:#d1b67a;padding:8px">✦ VS ✦</div><div class="battlegrid">${b.ally.map(combatUnit).join('')}</div></div>${b.done?`<div class="card"><h2>${b.rewards.g?'🏆 승리!':'☁ 패배'}</h2>${b.rewards.g?`<p>💎 +${b.rewards.g}　🪙 +${b.rewards.gold}</p>`:'<p>파티를 육성해 다시 도전하세요.</p>'}<button class="gold" onclick="afterBattle()">${b.mode==='tower'&&b.rewards.g?'다음 층 도전':'돌아가기'}</button></div>`:`<div class="card battle-panel" style="margin-top:9px"><div class="row between"><b>${u.name} · ${JOB[u.job]}</b><span class="muted" style="font-size:11px">${selText}</span></div><div class="actions">${[0,1,2,3].map(m=>abilityButton(f,m)).join('')}</div><div class="ability-summary"><b>선택 스킬: ${abilityInfo(f,selectedAction).title}</b><div>${abilityInfo(f,selectedAction).text}</div><small>피해량은 대상 방어력·속성·치명타에 따라 달라져요. 보호막은 HP 피해보다 먼저 소모돼요.</small></div><div class="step-hint">① 행동할 영웅 선택 → ② 스킬 선택 → ③ ${((u.job===1||u.job===3)&&(selectedAction===1||selectedAction===2))?'아군':'적군'} 카드 터치</div></div>`}<div class="card"><b>📜 전투 기록</b><div class="battlelog" id="log">${b.log.slice(-9).map(t=>`<div>${escapeHTML(t)}</div>`).join('')}</div></div>${!b.done?`<button class="small danger" onclick="if(confirm('전투를 포기할까요?'))finish(false,true)">전투 포기</button>`:''}`}
function redeemCoupon(){
 const field=document.getElementById('couponInput');
 const code=field?field.value.trim().toLowerCase():'';
 if(!code){toast('쿠폰 코드를 입력하세요');return;}
 if(code!=='we11cone'){toast('존재하지 않는 쿠폰 코드입니다');return;}
 if(!s.redeemedCodes||typeof s.redeemedCodes!=='object')s.redeemedCodes={};
 if(s.redeemedCodes.we11cone){toast('이미 사용한 쿠폰입니다');return;}
 s.redeemedCodes.we11cone=true;
 s.gems+=1000;
 save();render();toast('🎁 쿠폰 성공! 10회 소환분 보석 1,000개 지급');
}
function adminLogin(){
 if(s.admin){toast('관리자 모드가 켜져 있어요');return}
 const entered=prompt('관리자 코드 입력');
 if(entered===null)return;
 if(entered.trim()!=='kakkak1208'){alert('관리자 코드가 일치하지 않습니다.');return}
 s.admin=true;save();render();toast('관리자 모드 활성화');
}
function adminUnlock(){if(!s.admin)return;for(let id=0;id<30;id++){s.owned[id]=1;if(!s.exp[id])s.exp[id]=1;if(s.shards[id]===undefined)s.shards[id]=0;}if(!s.team.length)s.team=[0,1,2];save();render();toast('모든 캐릭터 해금 완료')}
function adminLevel(){if(!s.admin)return;for(let id=0;id<30;id++){s.owned[id]=1;s.exp[id]=100;}if(!s.team.length)s.team=[0,1,2];save();render();toast('모든 캐릭터 100레벨 달성')}
function adminSkill(){if(!s.admin)return;for(let id=0;id<30;id++){s.owned[id]=1;s.skillLv[id]=5;}save();render();toast('전원 스킬 +5 완료')}
function adminAwaken(){if(!s.admin)return;for(let id=0;id<30;id++){s.owned[id]=1;s.exp[id]=100;s.awaken[id]=true;}save();render();toast('전원 각성 완료')}
function adminOff(){if(!s.admin)return;s.admin=false;save();render();toast('관리자 모드 종료 (진행도 유지)')}
function settings(){return `<h2>⚙ 설정 · 데이터 관리</h2><div class="card"><h3>자동 저장</h3><p>전투 결과, 캐릭터, 재화, 스토리 진행 상황이 현재 브라우저에 자동 저장됩니다.</p><button onclick="exportSave()">⬇ 백업 파일 다운로드</button><p>백업 복원 (현재 저장 데이터 덮어씀)</p><input type="file" accept=".json,application/json" onchange="importSave(event)"></div><div class="card"><h3>🎟 쿠폰 코드</h3><p class="muted">쿠폰은 코드당 한 번만 사용할 수 있어요. 소환 10회는 보석 1,000개입니다.</p><div class="row" style="flex-wrap:wrap;gap:8px"><input id="couponInput" aria-label="쿠폰 코드 입력" autocomplete="off" maxlength="32" placeholder="쿠폰 코드 입력" style="flex:1;min-width:150px;padding:12px;border-radius:10px;border:1px solid #806f4e;background:#172135;color:#f8e8bc"><button class="gold" onclick="redeemCoupon()">쿠폰 사용</button></div>${s.redeemedCodes&&s.redeemedCodes.we11cone?'<p class="muted">✓ 첫 소환 쿠폰 사용 완료</p>':''}</div><div class="card"><h3>🔐 관리자 모드</h3>${s.admin?`<div class="notice">✅ 관리자 모드 활성화 · 💎 보석 및 🪙 골드 무한</div><div class="grid2"><button class="gold" onclick="adminUnlock()">🔓 전원 해금</button><button class="gold" onclick="adminLevel()">⬆ 전원 100레벨</button><button onclick="adminSkill()">✨ 전원 스킬 +5</button><button onclick="adminAwaken()">🌟 전원 각성</button></div><p class="muted">관리자 모드를 꺼도 이미 해금한 영웅과 육성 정보는 유지됩니다.</p><button class="small danger" onclick="adminOff()">관리자 모드 끄기</button>`:`<p class="muted">관리자 코드를 입력하면 테스트용 기능을 사용할 수 있습니다.</p><button onclick="adminLogin()">🔑 관리자 코드 입력</button>`}</div><div class="card"><h3>주의</h3><p class="muted">브라우저 데이터를 지우거나 다른 기기에서 열면 기존 데이터가 자동으로 옮겨지지 않습니다. 정기적으로 백업하세요.</p><button class="danger" onclick="resetGame()">게임 데이터 초기화</button></div><button onclick="switchView('home')">← 홈으로</button>`}
function exportSave(){let str=JSON.stringify(s,null,2),blob=new Blob([str],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='별의잔향_백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importSave(ev){let file=ev.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(x.version!==1||typeof x.gems!=='number'||!x.owned||!Array.isArray(x.team)||typeof x.pity!=='number')throw Error('형식 오류');if(!confirm('현재 진행 상황을 백업 데이터로 덮어쓸까요?'))return;s=x;battle=null;modal=null;save();render();toast('복원 완료')}catch(e){alert('유효한 백업 파일이 아닙니다.')}};reader.readAsText(file)}
function resetGame(){if(prompt('정말 초기화하려면 초기화 라고 입력하세요')==='초기화'){s=newSave();battle=null;modal=null;save();switchView('home')}}
function render(){let content=({home, battle:battlePage,summon:summonPage,units:unitsPage,book,settings})[view]();let markup=`<div class="wrap">${gameHeader()}<main class="page">${content}<div class="footer">별의 잔향 · 오프라인 단일 파일 RPG · 실물 결제 없음</div></main>${nav()}</div>${modalHtml()}`;if(/>undefined</.test(markup)){console.warn('표시 데이터 누락 발견');markup=markup.replace(/>undefined</g,'>정보 없음<')} $('app').innerHTML=markup;let log=$('log');if(log)log.scrollTop=log.scrollHeight}
window.addEventListener('beforeunload',save);render();
</script></body></html>
